# ─────────────────────────────────────────────────────────────
# Netlify configuration for Svasa Metric frontend
# ─────────────────────────────────────────────────────────────

[build]
  # Run build from the client directory
  command = "npm run build"
  publish = "build"

# ─── API proxy ────────────────────────────────────────────────
# All /api/* calls are forwarded to the live backend.
# Replace the placeholder URL below with your actual backend URL
# (e.g. https://your-app.onrender.com or https://your-app.railway.app)
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR_BACKEND_URL.com/api/:splat"
  status = 200
  force  = true

# ─── SPA fallback ─────────────────────────────────────────────
# Ensures React Router handles all client-side routes;
# prevents 404 on hard refresh or direct URL access.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
